<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Track Progress</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px #ddd;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #4285f4;
        }

        nav a {
            text-decoration: none;
            margin-left: 25px;
            color: #333;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #4285f4;
        }

        .cards {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
            color: #4285f4;
        }

        .progress-box {
            background: white;
            margin-top: 40px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .bar {
            width: 100%;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .fill {
            width: 65%;
            height: 100%;
            background: #4285f4;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">📚 StudyMate</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="smart-notes.html">Smart Notes</a>
        <a href="quiz.html">Quiz</a>
        <a href="ask-ai.html">Ask AI</a>
    </nav>
</header>

<div class="container">

    <h1>📊 Track Your Progress</h1>

    <div class="cards">

        <div class="card">
            <div class="number">12</div>
            <p>Notes Created</p>
        </div>

        <div class="card">
            <div class="number">8</div>
            <p>Quizzes Completed</p>
        </div>

        <div class="card">
            <div class="number">75%</div>
            <p>Quiz Average</p>
        </div>

    </div>

    <div class="progress-box">

        <h2>Overall Learning Progress</h2>

        <div class="bar">
            <div class="fill"></div>
        </div>

        <p>65% of your learning goal completed 🎯</p>

        <button onclick="alert('Keep learning! You are doing great! 🎉')">
            Continue Learning
        </button>

    </div>

</div>

</body>
</html>
