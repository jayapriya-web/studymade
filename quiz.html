<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate - Quick Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        📚 StudyMate
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="notes.html">Smart Notes</a>
        <a href="quiz.html">Quick Quiz</a>
        <a href="ask-ai.html">Ask AI</a>
        <a href="progress.html">Progress</a>
    </nav>

</header>


<section class="quiz-section">

    <h1>❓ Quick Quiz</h1>

    <p>Test your knowledge and improve your learning!</p>

    <div class="quiz-box">

        <div id="questionNumber">
            Question 1 of 5
        </div>

        <h2 id="question">
            Question
        </h2>

        <div id="options"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Next ➜
        </button>

        <div id="result"></div>

    </div>

</section>


<footer>

    <p>
        © 2026 StudyMate | Quick Quiz
    </p>

</footer>


<script>

const questions = [

    {
        question: "What does CPU stand for?",
        options: [
            "Central Processing Unit",
            "Computer Personal Unit",
            "Central Program Utility",
            "Control Processing User"
        ],
        answer: 0
    },

    {
        question: "Which language is used to style web pages?",
        options: [
            "Python",
            "CSS",
            "Java",
            "SQL"
        ],
        answer: 1
    },

    {
        question: "Which HTML tag is used for the main heading?",
        options: [
            "<p>",
            "<head>",
            "<h1>",
            "<title>"
        ],
        answer: 2
    },

    {
        question: "Which one is a database management system?",
        options: [
            "MySQL",
            "HTML",
            "CSS",
            "JavaScript"
        ],
        answer: 0
    },

    {
        question: "What does AI stand for?",
        options: [
            "Automatic Internet",
            "Artificial Intelligence",
            "Advanced Input",
            "Applied Information"
        ],
        answer: 1
    }

];


let currentQuestion = 0;
let score = 0;


function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question").innerText =
        q.question;

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.innerText = option;

        button.className = "option";

        button.onclick = function () {

            selectAnswer(index);

        };

        optionsDiv.appendChild(button);

    });

}


function selectAnswer(selected) {

    const correct =
        questions[currentQuestion].answer;

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(button => {

        button.disabled = true;

    });


    if (selected === correct) {

        score++;

        alert("Correct Answer! 🎉");

    } else {

        alert("Wrong Answer! ❌");

    }

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        document.getElementById("questionNumber")
            .innerText = "Quiz Completed 🎉";

        document.getElementById("question")
            .innerText = "Great job!";

        document.getElementById("options")
            .innerHTML = "";

        document.getElementById("nextBtn")
            .style.display = "none";


        document.getElementById("result")
            .innerText =
            "Your Score: " +
            score +
            " / " +
            questions.length;


        /* SAVE QUIZ SCORE */

        localStorage.setItem(
            "quizScore",
            score
        );

        localStorage.setItem(
            "quizTotal",
            questions.length
        );

    }

}


loadQuestion();

</script>

</body>

</html>
